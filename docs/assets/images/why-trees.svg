<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 715 345" width="715" height="345" role="img" aria-labelledby="t d">
  <title id="t">Three category trees that each need a Dog</title>
  <desc id="d">By descent: Mammals has Canines (Dog, Wolf), Felines (Cat), Equines (Miniature pony) and Mustelids (Ferret). By role: Service animals has Dog and Miniature pony. By care: Pets requiring vaccination has Dog, Cat and Ferret. Every animal in the second and third trees is a duplicate term, because a category can have only one parent.</desc>
  <style>
    text { font-family: Inter, -apple-system, "Segoe UI", Roboto, Arial, sans-serif; font-size: 12px; fill: #14222e; text-anchor: middle; }
    .title { font-size: 13px; font-weight: 600; fill: #0a7fb8; }
    .node { fill: #e8f2f8; stroke: #1c78a1; stroke-width: 1.5; }
    .root { fill: #1c78a1; stroke: #1c78a1; }
    .rootText { fill: #ffffff; font-weight: 600; }
    .dup { fill: #ffffff; stroke: #c0392b; stroke-width: 1.5; stroke-dasharray: 5 3; }
    .dupText { fill: #c0392b; }
    .edge { stroke: #7a8c99; stroke-width: 1.2; fill: none; }
    .sep { stroke: #d5dde3; stroke-width: 1; }
    .legend { text-anchor: start; fill: #4a5a66; }
  </style>

  <!-- Panel 1: descent -->
  <text class="title" x="190" y="22">By descent (one category tree)</text>
  <path class="edge" d="M190 70 V95 H71 V120 M190 95 H330 V120 M175 95 V120 M250 95 V120"/>
  <path class="edge" d="M71 150 V175 H36 V200 M71 175 H106 V200 M175 150 V200 M250 150 V200 M330 150 V200"/>
  <rect class="node root" x="140" y="40" width="100" height="30" rx="6"/>
  <text class="rootText" x="190" y="59">Mammals</text>
  <rect class="node" x="38" y="120" width="66" height="30" rx="6"/><text x="71" y="139">Canines</text>
  <rect class="node" x="142" y="120" width="66" height="30" rx="6"/><text x="175" y="139">Felines</text>
  <rect class="node" x="217" y="120" width="66" height="30" rx="6"/><text x="250" y="139">Equines</text>
  <rect class="node" x="297" y="120" width="66" height="30" rx="6"/><text x="330" y="139">Mustelids</text>
  <rect class="node" x="3" y="200" width="66" height="30" rx="6"/><text x="36" y="219">Dog</text>
  <rect class="node" x="73" y="200" width="66" height="30" rx="6"/><text x="106" y="219">Wolf</text>
  <rect class="node" x="142" y="200" width="66" height="30" rx="6"/><text x="175" y="219">Cat</text>
  <rect class="node" x="214" y="200" width="72" height="30" rx="6"/><text x="250" y="219">Mini pony</text>
  <rect class="node" x="294" y="200" width="72" height="30" rx="6"/><text x="330" y="219">Ferret</text>

  <line class="sep" x1="390" y1="10" x2="390" y2="285"/>

  <!-- Panel 2: role -->
  <text class="title" x="555" y="22">By role</text>
  <path class="edge" d="M555 70 V85 H510 V100 M555 85 H600 V100"/>
  <rect class="node root" x="490" y="40" width="130" height="30" rx="6"/>
  <text class="rootText" x="555" y="59">Service animals</text>
  <rect class="dup" x="477" y="100" width="66" height="30" rx="6"/><text class="dupText" x="510" y="119">Dog</text>
  <rect class="dup" x="564" y="100" width="72" height="30" rx="6"/><text class="dupText" x="600" y="119">Mini pony</text>

  <line class="sep" x1="405" y1="150" x2="705" y2="150"/>

  <!-- Panel 3: care -->
  <text class="title" x="555" y="175">By care</text>
  <path class="edge" d="M555 223 V238 H478 V253 M555 238 V253 M555 238 H633 V253"/>
  <rect class="node root" x="452" y="193" width="206" height="30" rx="6"/>
  <text class="rootText" x="555" y="212">Pets requiring vaccination</text>
  <rect class="dup" x="445" y="253" width="66" height="30" rx="6"/><text class="dupText" x="478" y="272">Dog</text>
  <rect class="dup" x="522" y="253" width="66" height="30" rx="6"/><text class="dupText" x="555" y="272">Cat</text>
  <rect class="dup" x="597" y="253" width="72" height="30" rx="6"/><text class="dupText" x="633" y="272">Ferret</text>

  <!-- Legend -->
  <rect class="node" x="10" y="306" width="22" height="16" rx="4"/>
  <text class="legend" x="40" y="318">One term</text>
  <rect class="dup" x="130" y="306" width="22" height="16" rx="4"/>
  <text class="legend" x="160" y="318">A duplicate term: a second "Dog" with its own archive, unconnected to the first.</text>
  <text class="legend" x="160" y="336">Tag a post with one, and the other archives never show it.</text>
</svg>
